name: Omega desktop package
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - run: python -m pip install --no-index --find-links dist s-omega-preview
      - run: s-omega doctor
      - run: python -m unittest discover -s tests
      - uses: actions/upload-artifact@v4
        with:
          name: omega-wheel-${{ matrix.os }}
          path: dist/*.whl
          if-no-files-found: error
